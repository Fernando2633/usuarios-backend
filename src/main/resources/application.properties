spring.application.name=usuarios-backend
server.port=${PORT:8080}

# Base de datos: MySQL en local / PostgreSQL en Render (variables de entorno).
# El driver se detecta solo a partir de la URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/red_social?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Origenes permitidos para CORS (URL del frontend en Render)
app.cors.allowed-origins=${CORS_ORIGINS:*}
